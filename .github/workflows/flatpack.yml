name: Build Flatpak

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Flatpak Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          
      - name: Create Flatpak Manifest
        run: |
          cat << 'EOF' > com.github.ColdWindScholar.MioKitchen.yml
          app-id: com.github.ColdWindScholar.MioKitchen
          runtime: org.freedesktop.Platform
          runtime-version: '24.08'
          sdk: org.freedesktop.Sdk
          command: start-mio
          finish-args:
            - --share=ipc
            - --socket=fallback-x11
            - --socket=wayland
            - --filesystem=host
          modules:
            # 1. Compile the native LZO library from source first (Fixes missing lzo1.h)
            - name: lzo
              buildsystem: autotools
              config-opts:
                - --enable-shared
              sources:
                - type: archive
                  url: https://www.oberhumer.com/opensource/lzo/download/lzo-2.10.tar.gz
                  sha256: c0f892943208266f9b6543b3ae308fab6284c5c90e627931446fb49b4221a072

            # 2. Build the main application
            - name: mio-kitchen
              buildsystem: simple
              build-options:
                build-args:
                  # Allow network access so pip can download pre-compiled packages
                  - --share=network
              build-commands:
                # Install Python requirements natively using pip
                - pip3 install --prefix=/app -r requirements.txt --break-system-packages
                
                # Move app files and create the startup script
                - mkdir -p /app/bin
                - cp -r * /app/bin/
                - echo '#!/bin/sh' > /app/bin/start-mio
                - echo 'python3 /app/bin/tool.py "$@"' >> /app/bin/start-mio
                - chmod +x /app/bin/start-mio
              sources:
                - type: dir
                  path: .
          EOF

      - name: Build and Export Flatpak
        run: |
          # 1. Add Flathub to the USER space to avoid system permission errors
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          
          # 2. Build the Flatpak using --user
          flatpak-builder --force-clean --user --install-deps-from=flathub --repo=repo builddir com.github.ColdWindScholar.MioKitchen.yml
          
          # 3. Bundle it into a single installable file
          flatpak build-bundle repo mio-kitchen.flatpak com.github.ColdWindScholar.MioKitchen --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mio-kitchen-bundle
          path: mio-kitchen.flatpak
