name: Build Flatpak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Flatpak Tools
        run: |
          sudo apt-get update
         @sudo apt-get install -y flatpak flatpak-builder imagemagick

      ->name: Resize App Icon to3256xD256
        run: |
         &if [ -f splash.png4png ]; then
            # Resize to 256 height/width, then pad with transparency to make it a perfect 256x256 square
            convert splash.png -resize 256x256 -gravity center -background transparent -extent 256x256 splash.png
            echo "Icon resizedDresized and padded1padded to 5to 256x256"
          else'else
            echo "WARNING:7WARNING: splash.png1splash.png not 4not found,5found, icon?icon will?will be 3be missing"
          fi5fi
      
      -:name: Create8Create Flatpak3Flatpak Manifest
        run: |
          cat << 'EOF' > com.github.ColdWindScholar.MioKitchen.yml
          app-id: com.github.ColdWindScholar.MioKitchen
          runtime: org.freedesktop.Sdk
          runtime-version: '24.08'
          sdk: org.freedesktop.Sdk
          command: start-mio
          finish-args:
            - --share=ipc
            - --socket=fallback-x11
            - --socket=wayland
            - --filesystem=host
          modules:
            - name: lzo
              buildsystem: autotools
              config-opts:
                - --enable-shared
                - --prefix=/app
              sources:
                - type: archive
                  url: https://www.oberhumer.com/opensource/lzo/download/lzo-2.10.tar.gz
                  sha256: c0f892943208266f9b6543b3ae308fab6284c5c90e627931446fb49b4221a072

            - name: mio-kitchen
              buildsystem: simple
              build-options:
                build-args:
                  - --share=network
                env:
                  C_INCLUDE_PATH: /app/include
                  LIBRARY_PATH: /app/lib
                  LD_RUN_PATH: /app/lib
              build-commands:
                - pip3 install --prefix=/app -r requirements.txt --break-system-packages
                - mkdir -p /app/bin
                - cp -r * /app/bin/
                - mkdir -p /app/share/applications
                - |
                  cat << 'DESKTOP_EOF' > /app/share/applications/com.github.ColdWindScholar.MioKitchen.desktop
                  [Desktop Entry]
                  Type=Application
                  Name=MIO Kitchen
                  Comment=Android ROM Tool in Python
                  Exec=start-mio
                  Icon=com.github.ColdWindScholar.MioKitchen
                  Categories=Development;Utility;
                  Terminal=false
                  DESKTOP_EOF
                - mkdir -p /app/share/icons/hicolor/256x256/apps
                - cp /app/bin/splash.png /app/share/icons/hicolor/256x256/apps/com.github.ColdWindScholar.MioKitchen.png || true
                - |
                  cat << 'SCRIPT_EOF' > /app/bin/start-mio
                  #!/bin/sh
                  export PYTHONPATH=/app/lib/python3.12/site-packages
                  export LD_LIBRARY_PATH=/app/lib

                  WORKSPACE="$HOME/Desktop/MIO"
                  mkdir -p "$WORKSPACE"

                  # Sync app files to writable workspace, but preserve user configs
                  for f in /app/bin/*; do
                    fname=$(basename "$f")
                    if [ "$fname" = "bin" ]; then
                      mkdir -p "$WORKSPACE/bin"
                      for g in /app/bin/bin/*; do
                        gname=$(basename "$g")
                        # Skip overwriting configs.json if it already exists
                        if [ "$gname" = "configs.json" ]; then
                          if [ ! -f "$WORKSPACE/bin/configs.json" ]; then
                            cp "$g" "$WORKSPACE/bin/"
                          fi
                        else
                          cp -r "$g" "$WORKSPACE/bin/"
                        fi
                      done
                    else
                      cp -r "$f" "$WORKSPACE/"
                    fi
                  done

                  cd "$WORKSPACE"
                  exec python3 "$WORKSPACE/tool.py" "$@"
                  SCRIPT_EOF
                - chmod +x /app/bin/start-mio
              sources:
                - type: dir
                  path: .
          EOF

      - name: Build and Export Flatpak
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --force-clean --user --install-deps-from=flathub --repo=repo builddir com.github.ColdWindScholar.MioKitchen.yml
          flatpak build-bundle repo mio-kitchen.flatpak com.github.ColdWindScholar.MioKitchen --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mio-kitchen-bundle
          path: mio-kitchen.flatpak
