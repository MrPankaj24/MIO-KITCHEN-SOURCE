name: Build Flatpak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Flatpak Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder imagemagick python3-pip

      - name: Resize App Icon to 256x256
        run: |
          if [ -f splash.png ]; then
            convert splash.png -resize 256x256 -gravity center -background transparent -extent 256x256 splash.png
            echo "Icon resized and padded to 256x256"
          else
            echo "WARNING: splash.png not found, icon will be missing"
          fi
      
      - name: Create Flatpak Manifest
        run: |
          cat << 'EOF' > com.github.ColdWindScholar.MioKitchen.yml
          app-id: com.github.ColdWindScholar.MioKitchen
          runtime: org.freedesktop.Platform
          runtime-version: '24.08'
          sdk: org.freedesktop.Sdk
          command: start-mio
          finish-args:
            - --share=ipc
            - --socket=x11
            - --socket=wayland
            - --share=network
            - --device=dri
            - --filesystem=host
            - --env=DISPLAY=:0
          modules:
            - name: lzo
              buildsystem: autotools
              config-opts:
                - --enable-shared
                - --prefix=/app
              sources:
                - type: archive
                  url: https://www.oberhumer.com/opensource/lzo/download/lzo-2.10.tar.gz
                  sha256: c0f892943208266f9b6543b3ae308fab6284c5c90e627931446fb49b4221a072

            - name: mio-kitchen
              buildsystem: simple
              build-options:
                build-args:
                  - --share=network
                env:
                  C_INCLUDE_PATH: /app/include
                  LIBRARY_PATH: /app/lib
                  LD_RUN_PATH: /app/lib
              build-commands:
                - python3 -m venv /app/env
                - /app/env/bin/pip install --upgrade pip
                - /app/env/bin/pip install -r requirements.txt --break-system-packages
                - mkdir -p /app/share/mio-kitchen
                - cp -r * /app/share/mio-kitchen/
                - mkdir -p /app/share/applications
                - |
                  cat << 'DESKTOP_EOF' > /app/share/applications/com.github.ColdWindScholar.MioKitchen.desktop
                  [Desktop Entry]
                  Type=Application
                  Name=MIO Kitchen
                  Comment=Android ROM Tool in Python
                  Exec=start-mio
                  Icon=com.github.ColdWindScholar.MioKitchen
                  Categories=Development;Utility;
                  Terminal=false
                  DESKTOP_EOF
                - mkdir -p /app/share/icons/hicolor/256x256/apps
                - cp /app/share/mio-kitchen/splash.png /app/share/icons/hicolor/256x256/apps/com.github.ColdWindScholar.MioKitchen.png || true
                - mkdir -p /app/bin
                - |
                  cat << 'SCRIPT_EOF' > /app/bin/start-mio
                  #!/bin/sh
                  export LD_LIBRARY_PATH=/app/lib

                  WORKSPACE="$HOME/MIO_Workspace"
                  mkdir -p "$WORKSPACE"

                  for f in /app/share/mio-kitchen/*; do
                    fname=$(basename "$f")
                    if [ ! -e "$WORKSPACE/$fname" ]; then
                      cp -r "$f" "$WORKSPACE/"
                    fi
                  done

                  cd "$WORKSPACE"
                  exec /app/env/bin/python "$WORKSPACE/tool.py" "$@"
                  SCRIPT_EOF
                - chmod +x /app/bin/start-mio
              sources:
                - type: dir
                  path: .
          EOF

      - name: Build and Export Flatpak
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --force-clean --user --install-deps-from=flathub --repo=repo builddir com.github.ColdWindScholar.MioKitchen.yml
          flatpak build-bundle repo mio-kitchen.flatpak com.github.ColdWindScholar.MioKitchen --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mio-kitchen-bundle
          path: mio-kitchen.flatpak
